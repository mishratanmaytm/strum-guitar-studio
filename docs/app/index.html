<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110F">
<title>Strum – Guitar Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon-192.png" alt=""><b>STRUM</b></div>
  <span class="sub" id="screenTitle">Tuner</span>
</header>

<main>
  <!-- TUNER -->
  <section id="tab-tuner" class="screen">
    <div class="row between">
      <select id="tuneSelect" aria-label="Tuning"></select>
      <div class="stepper">
        <button id="a4Minus" aria-label="Lower A4">&minus;</button>
        <span>A4 <b id="a4Val">440</b></span>
        <button id="a4Plus" aria-label="Raise A4">+</button>
      </div>
    </div>
    <div class="card gaugeCard">
      <svg id="gauge" class="gauge" viewBox="0 0 300 160" aria-hidden="true">
        <path class="arc" d="M 65.1 65.1 A 120 120 0 0 1 234.9 65.1"/>
        <g id="ticks"></g>
        <line id="needle" x1="150" y1="150" x2="150" y2="52"/>
        <circle class="hub" cx="150" cy="150" r="9"/>
      </svg>
      <div class="noteRow"><span id="noteBig">–</span><sup id="noteOct"></sup></div>
      <div id="tuneStatus" class="status">Tap Start</div>
      <div class="two"><span id="centsTxt"></span><span id="freqTxt"></span></div>
    </div>
    <div id="strings" class="strings"></div>
    <p class="hint">Tap a string to hear its note.</p>
    <button id="tuneBtn" class="big">Start</button>
    <p id="tuneMsg" class="msg"></p>
  </section>

  <!-- METRONOME -->
  <section id="tab-metronome" class="screen">
    <div class="card center">
      <div class="bpm"><span id="bpmVal">100</span><small>BPM</small></div>
      <div id="tempoName" class="tempo">Andante</div>
      <div class="row center">
        <button id="bpmMinus5" class="round">−5</button>
        <button id="bpmMinus" class="round">−</button>
        <button id="bpmPlus" class="round">+</button>
        <button id="bpmPlus5" class="round">+5</button>
      </div>
      <input id="bpmSlider" type="range" min="30" max="300" value="100" aria-label="Tempo">
      <div id="beats" class="beats"></div>
    </div>
    <div class="row between">
      <select id="sigSelect" aria-label="Time signature">
        <option>2/4</option><option>3/4</option><option selected>4/4</option>
        <option>5/4</option><option>6/8</option><option>7/8</option>
      </select>
      <button id="subBtn" class="chip">Eighth-note clicks</button>
      <button id="tapBtn" class="chip">Tap tempo</button>
    </div>
    <button id="metBtn" class="big">Start</button>
  </section>

  <!-- CHORDS -->
  <section id="tab-chords" class="screen">
    <div id="roots" class="chips"></div>
    <div id="types" class="chips"></div>
    <div class="card center">
      <h2 id="chordName">C</h2>
      <div id="chordNotes" class="dim"></div>
      <div id="chordSvg" class="diagram"></div>
      <div id="voicings" class="chips small"></div>
    </div>
    <button id="playChord" class="big">▶ Strum it</button>
  </section>

  <!-- PRACTICE -->
  <section id="tab-practice" class="screen">
    <div class="stats">
      <div class="card stat"><b id="streakVal">0</b><small>day streak 🔥</small></div>
      <div class="card stat"><b id="todayVal">0</b><small>min today</small></div>
      <div class="card stat"><b id="weekVal">0</b><small>min this week</small></div>
    </div>
    <div class="card">
      <div class="row between"><span id="goalTxt">0 / 15 min today</span>
        <label class="goal">Goal <input id="goalInput" type="number" min="1" max="600" inputmode="numeric"> min</label></div>
      <div class="track"><div id="goalBar"></div></div>
      <div id="weekBars" class="week"></div>
    </div>
    <div class="card">
      <div class="timer" id="timerTxt">00:00</div>
      <div class="row">
        <select id="catSel" aria-label="What are you practising?">
          <option>Chords</option><option>Scales</option><option>Songs</option>
          <option>Technique</option><option>Ear training</option><option>Other</option>
        </select>
        <input id="noteInp" type="text" maxlength="80" placeholder="Note (optional)">
      </div>
      <button id="timerBtn" class="big">Start practising</button>
      <div class="row add">
        <input id="addMin" type="number" min="1" max="600" inputmode="numeric" placeholder="Minutes">
        <button id="addBtn" class="chip">Add manually</button>
      </div>
    </div>
    <div id="logList"></div>
  </section>
</main>

<nav id="nav">
  <button data-tab="tuner" class="on"><i>🎯</i>Tuner</button>
  <button data-tab="metronome"><i>🥁</i>Metronome</button>
  <button data-tab="chords"><i>🎸</i>Chords</button>
  <button data-tab="practice"><i>📈</i>Practice</button>
</nav>

<script src="audio.js"></script>
<script src="tuner.js"></script>
<script src="metronome.js"></script>
<script src="chords.js"></script>
<script src="practice.js"></script>
<script src="main.js"></script>
</body>
</html>
